# Configuração do Dependabot para o ifrn-editorial-portal.
# Ver https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Corrige o template padrão (ecossistema vazio) para os três ecossistemas
# reais introduzidos na Fase 1: frontend (npm), backend (pip) e workflows
# de CI (github-actions).

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # TS 7 ainda não é suportado por vue-tsc nem typescript-eslint.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vitest e @vitest/* devem migrar juntos para o major 5.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # Tipos devem acompanhar o Node do CI (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
