name: CI

# CI mínimo da Fase 1: lint, testes e build do frontend; lint e testes do
# backend; verificação de arquivos sensíveis. Fase 4.5: auditoria de
# vulnerabilidades de dependências (npm audit / pip-audit) — ver
# docs/phase-4.5-plan.md e ADR-0015. Implantação real é um workflow
# separado (.github/workflows/deploy.yml), não este.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificação de tipos
        run: npm run type-check

      - name: Testes unitários
        run: npm run test

      - name: Build de produção
        run: npm run build

      # Fase 4.5, ADR-0015: só falha para high/critical, complementando o
      # Dependabot já configurado (captura no momento do PR, não só na
      # execução agendada). Um alto sem correção disponível ainda falharia
      # aqui — se isso acontecer, avaliar `npm audit fix` ou registrar uma
      # exceção explícita, não abaixar o nível silenciosamente.
      - name: Auditoria de dependências (npm audit)
        run: npm audit --audit-level=high

  backend:
    name: Backend (lint, testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Testes
        run: pytest

      # Fase 4.5, ADR-0015: complementa o Dependabot já configurado
      # (captura no momento do PR, não só na execução agendada).
      # `pip-audit` não tem um nível de severidade equivalente ao
      # `--audit-level` do npm — qualquer vulnerabilidade conhecida falha
      # o build; uma sem correção disponível pode ser suprimida
      # explicitamente com `--ignore-vuln <ID>` (nunca silenciosamente).
      - name: Auditoria de dependências (pip-audit)
        run: pip-audit -r requirements-dev.txt

  sensitive-files-check:
    name: Verificação de arquivos sensíveis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rejeitar .env, chaves privadas e afins versionados
        run: |
          set -euo pipefail

          # .env.example / .env.sample / .env.template são templates
          # intencionais e não entram na verificação.
          matches=$(git ls-files \
            | grep -E '(^|/)\.env(\..+)?$|\.pem$|\.key$|_rsa$|_ed25519$' \
            | grep -vE '\.env\.(example|sample|template)$' || true)
          if [ -n "$matches" ]; then
            echo "Arquivos sensíveis não devem ser versionados:"
            echo "$matches"
            exit 1
          fi

          # backend/.env.example traz, em comentário, um exemplo ilustrativo
          # do formato aceito para GITHUB_APP_PRIVATE_KEY (ver
          # src/config.py) — não é uma chave real. Excluído aqui pelo
          # mesmo motivo que já é excluído do hook detect-private-key no
          # .pre-commit-config.yaml.
          if git grep -nIE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . \
              ':(exclude).github/workflows/ci.yml' \
              ':(exclude)backend/.env.example'; then
            echo "Conteúdo compatível com chave privada encontrado no repositório."
            exit 1
          fi

          echo "Nenhum arquivo sensível encontrado."
