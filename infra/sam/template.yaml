AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  ifrn-editorial-portal — backend da Fase 1 (spike de leitura).
  Não implantado nesta fase — ver docs/phase-1-plan.md. Este template
  documenta a infraestrutura mínima prevista em ADR-0005; segredos reais
  ficam no AWS Secrets Manager, nunca neste arquivo.

Parameters:
  Stage:
    Type: String
    Default: development
    AllowedValues:
      - development
      - production
    Description: Ambiente de implantação (ver infra/environments/*.yaml).
  FrontendUrl:
    Type: String
    Description: Origem do frontend, usada para CORS e redirecionamento pós-login.
  GithubOauthClientId:
    Type: String
    Description: Client ID da OAuth App do GitHub (não sensível).
  SecretsManagerSecretArn:
    Type: String
    Description: >
      ARN do segredo no AWS Secrets Manager contendo client secret da OAuth
      App, chave privada da GitHub App e segredo de sessão. Concedido em
      tempo de implantação — não é criado por este template.

Conditions:
  IsProduction: !Equals [!Ref Stage, production]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        GITHUB_OWNER: cte-zl-ifrn
        GITHUB_REPOSITORY: central-ajuda
        GITHUB_BASE_BRANCH: main
        SAMPLE_DOCUMENT_PATH: _docs/ambiente-virtual/acesso-moodle.md
        FRONTEND_URL: !Ref FrontendUrl
        GITHUB_OAUTH_CLIENT_ID: !Ref GithubOauthClientId
        COOKIE_SECURE: !If [IsProduction, "true", "false"]
        COOKIE_SAMESITE: !If [IsProduction, "none", "lax"]
        # O ARN em si não é sensível (só aponta para o segredo — ver
        # ADR-0012); os valores sensíveis de dentro dele
        # (GITHUB_OAUTH_CLIENT_SECRET, GITHUB_APP_ID,
        # GITHUB_APP_PRIVATE_KEY, SESSION_SECRET) nunca aparecem como
        # valor literal neste template. `get_settings()`
        # (backend/src/config.py) busca esse segredo uma única vez por
        # cold start quando esta variável está presente.
        SECRETS_MANAGER_SECRET_ARN: !Ref SecretsManagerSecretArn

Resources:
  PortalApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendUrl
        AllowCredentials: true
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - content-type

  PortalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../backend/
      Handler: src.lambda_handler.handler
      Policies:
        - Statement:
            - Sid: ReadPortalSecrets
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerSecretArn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /{proxy+}
            Method: ANY

  # Alarmes básicos de operação (Fase 4.2, ver docs/phase-4.2-plan.md).
  # Definidos aqui, sem canal de notificação real conectado (SNS/e-mail)
  # — conectar um canal depende de decidir quem deve ser notificado,
  # responsabilidade institucional fora do escopo do código. Limiares
  # abaixo são um ponto de partida, não um SLA — ajustar com dados reais
  # de uso após a primeira implantação.
  FunctionErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >
        Erros da função Lambda do backend acima do esperado.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PortalFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  FunctionLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >
        Duração (latência) média da função Lambda do backend acima do
        esperado.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref PortalFunction
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: URL base da API Gateway HTTP API
    Value: !Sub "https://${PortalApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  FunctionArn:
    Description: ARN da função Lambda do backend
    Value: !GetAtt PortalFunction.Arn
